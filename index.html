<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>EssentialSnap</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><div class="mark">↓</div><div><h1>EssentialSnap</h1><p>Save media you have permission to download.</p></div></header><section class="card"><label for="link">Paste a video or post link</label><input id="link" type="url" placeholder="https://…" autocomplete="off"><button id="inspect">Fetch media</button><p id="status" role="status">Paste a link to check supported formats.</p></section><section id="result" class="card hidden"><div id="info"><h2 id="title"></h2><p id="meta"></p></div><label for="quality">Quality / format</label><select id="quality"></select><button id="download">Download</button><p id="dlstatus" role="status"></p></section><section class="card"><label for="backend">Backend URL</label><input id="backend" type="url" placeholder="https://your-backend.example"><button id="saveBackend" class="secondary">Save backend</button><p id="backendStatus">Backend is required for fetching media.</p></section><footer>EssentialSnap · simple, private, no account</footer></main><script src="./app.js"></script></body></html>
